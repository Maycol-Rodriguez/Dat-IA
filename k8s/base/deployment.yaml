apiVersion: apps/v1
kind: Deployment
metadata:
  name: dat-ia-api
  labels:
    app.kubernetes.io/name: dat-ia-api
    app.kubernetes.io/part-of: dat-ia
    app.kubernetes.io/version: "0.2.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dat-ia-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dat-ia-api
        app.kubernetes.io/part-of: dat-ia
        app.kubernetes.io/version: "0.2.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dat-ia-api
          image: ghcr.io/maycol-rodriguez/dat-ia:0.2.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: dat-ia-config
            - secretRef:
                name: dat-ia-secrets

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: chroma-data
              mountPath: /app/chroma_db

            - name: huggingface-cache
              mountPath: /app/.cache/huggingface

      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: dat-ia-chroma

        - name: huggingface-cache
          emptyDir:
            sizeLimit: 1Gi
